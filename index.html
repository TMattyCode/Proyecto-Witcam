<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Witcam</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Reconocimiento facial local</p>
        <h1>Witcam</h1>
      </div>
      <span class="status-pill" id="systemStatus">Detenido</span>
    </header>

    <section class="dashboard">
      <article class="video-panel">
        <div class="camera-frame" id="cameraFrame">
          <img id="videoStream" src="/placeholder" alt="Video procesado por Witcam">
          <p id="cameraLabel">Camara lista para iniciar</p>
        </div>

        <div class="controls">
          <button class="primary" id="toggleCamera">Iniciar</button>
          <button id="reloadRefs">Recargar referencias</button>
        </div>
      </article>

      <aside class="side-panel">
        <section class="metric-grid">
          <div class="metric">
            <span>Personas reconocidas</span>
            <strong id="referenceCount">0</strong>
          </div>
          <div class="metric">
            <span>Personas pendientes</span>
            <strong id="pendingCount">0</strong>
          </div>
          <div class="metric">
            <span>Umbral</span>
            <strong id="thresholdValue">--</strong>
          </div>
        </section>

        <section class="panel-section">
          <div class="section-heading">
            <h2>Referencias</h2>
            <small>referencias_reconocimiento/</small>
          </div>
          <ul class="person-list" id="referencesList"></ul>
        </section>

        <section class="panel-section">
          <div class="section-heading">
            <h2>Pendientes</h2>
            <small>referencias_pendientes/</small>
          </div>
          <ul class="person-list" id="pendingList"></ul>
        </section>
      </aside>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
